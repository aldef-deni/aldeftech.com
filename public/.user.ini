; The admin accepts images up to 5MB, and Aldef Store product photos and
; videos up to 50MB each (config/aldeftech.php upload.*), but this cPanel host
; defaults upload_max_filesize to 2M, so larger files were dropped before
; Laravel saw them. Resizing a 50MB camera photo for the web needs roughly
; 250MB while it is decoded, hence the memory limit. PHP-FPM reads this file
; from the script's directory; changes apply within about five minutes.
upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
