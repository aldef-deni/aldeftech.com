; The admin accepts images up to 5MB and Aldef Store product videos up to 50MB
; (config/aldeftech.php upload.max_size / video_max_size), but this cPanel host
; defaults upload_max_filesize to 2M, so larger files were dropped before
; Laravel saw them. PHP-FPM reads this file from the script's directory;
; changes apply within about five minutes.
upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
