; The admin accepts images up to 5MB (config/aldeftech.php upload.max_size), but
; this cPanel host defaults upload_max_filesize to 2M, so a larger avatar or
; cover photo was dropped before Laravel saw it. PHP-FPM reads this file from
; the script's directory; changes apply within about five minutes.
upload_max_filesize = 10M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
